<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Being Orange – Web Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#0d1424;--ink:#f1f4fb;--muted:#8d98b3;--line:#1c2742;--accent:#ff8a1f;--warm:#6cb6ff;--btn:#f1f4fb;--btn-ink:#070b14;--grid:rgba(255,138,31,.05);
--f:"Outfit","Helvetica Neue",Arial,sans-serif;--m:"JetBrains Mono",ui-monospace,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6fa;--panel:#fff;--ink:#0d1424;--muted:#56627f;--line:#d5dce9;--accent:#c75a00;--warm:#1f6fb8;--btn:#0d1424;--btn-ink:#fff;--grid:rgba(199,90,0,.07);color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f6fa;--panel:#fff;--ink:#0d1424;--muted:#56627f;--line:#d5dce9;--accent:#c75a00;--warm:#1f6fb8;--btn:#0d1424;--btn-ink:#fff;--grid:rgba(199,90,0,.07);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px;color:var(--ink);font:400 1.05rem/1.65 var(--f)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.5rem}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:.8rem 0 0;display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.2rem;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:.8rem}
.logo{font:700 1.2rem var(--f);text-decoration:none}.logo i{color:var(--accent);font-style:normal}
.nav ul{display:flex;gap:1.3rem;list-style:none;margin:0;padding:0;font-size:.92rem}
.nav ul a{text-decoration:none;color:var(--muted)}.nav ul a:hover{color:var(--ink)}
.btn{display:inline-flex;gap:.4rem;align-items:center;padding:.7rem 1.3rem;border-radius:.5rem;font:500 .95rem var(--f);text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.solid{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:3rem;align-items:center;padding:5rem 0 4rem}
.status{font:500 .78rem var(--m);color:var(--accent);margin:0 0 1rem}
.status:before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);margin-right:.6rem}
h1{font:700 clamp(2.8rem,8vw,5.8rem)/.98 var(--f);letter-spacing:-.04em;margin:0 0 1.5rem}
h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--muted)}
.lead{color:var(--muted);max-width:34rem;margin:0 0 2rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap}
.card-id{position:relative;border:1px solid var(--line);border-radius:1.2rem;background:var(--panel);padding:1rem;font:400 .85rem var(--m)}
.card-id .shot{aspect-ratio:4/5;border-radius:.8rem;background:linear-gradient(160deg,#4a2209,#1f1810 60%,#1b1233);display:grid;place-items:center;font:700 5rem var(--f);color:var(--accent);letter-spacing:-.05em}
.card-id p{margin:.8rem 0 0;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1.2rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pillars b{display:block;font-weight:500}.pillars span{font:400 .8rem var(--m);color:var(--muted)}
section{padding:6rem 0 0}
h2{font:700 clamp(2.2rem,6vw,4rem)/1 var(--f);letter-spacing:-.035em;margin:0 0 1rem}
h2 span{color:transparent;-webkit-text-stroke:1.2px var(--muted)}
.sub{color:var(--muted);max-width:38rem;margin:0 0 2.2rem}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:1.4rem}
.card h3{margin:0 0 .5rem;font:700 1.25rem var(--f)}.card p{margin:0;color:var(--muted);font-size:.97rem}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.tags span{font:400 .85rem var(--m);border:1px solid var(--line);background:var(--panel);padding:.35rem .8rem;border-radius:.4rem}
.tags span.l{color:var(--warm);border-style:dashed}
.scroller{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem}
.proj{flex:0 0 min(22rem,85%);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;overflow:hidden}
.pv{height:10rem;background:repeating-linear-gradient(135deg,var(--line) 0 1px,transparent 1px 14px);display:flex;align-items:flex-end;justify-content:space-between;padding:.8rem;font:400 .8rem var(--m);color:var(--muted)}
.chip{padding:.2rem .6rem;border-radius:.3rem;border:1px solid var(--accent);color:var(--accent)}
.chip.plan{border-color:var(--warm);color:var(--warm)}
.pb{padding:1.2rem 1.3rem 1.4rem}.pb h3{margin:0 0 .4rem;font:700 1.3rem var(--f)}.pb p{margin:0 0 .8rem;color:var(--muted);font-size:.96rem}
.pb small{font:400 .8rem var(--m);color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;border-top:1px solid var(--line);padding-top:1.4rem}
.tl div{position:relative}.tl div:before{content:"";position:absolute;top:-1.75rem;left:0;width:.7rem;height:.7rem;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl div.now:before{background:var(--accent)}
.tl small{font:400 .78rem var(--m);color:var(--accent)}.tl b{display:block;margin:.2rem 0;font-weight:500}.tl p{margin:0;color:var(--muted);font-size:.93rem}
.term{background:#05080f;color:#d6f5ee;border:1px solid var(--line);border-radius:.9rem;font:400 .92rem/1.6 var(--m);max-width:44rem;overflow:hidden}
.term .bar{padding:.6rem 1rem;border-bottom:1px solid var(--line);color:#8d98b3;font-size:.8rem}
#out{padding:1rem;min-height:11rem;max-height:18rem;overflow:auto;white-space:pre-wrap}
.term form{display:flex;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
.term input{flex:1;background:none;border:0;color:inherit;font:inherit;min-width:0}
.term input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hints{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.hints button{font:400 .82rem var(--m);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:.4rem;padding:.3rem .7rem;cursor:pointer}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
label{display:block;font:400 .8rem var(--m);color:var(--muted);margin:0 0 1rem}
input.f,textarea{display:block;width:100%;margin-top:.35rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:.5rem;padding:.7rem .9rem;font:400 1rem var(--f)}
textarea{min-height:7rem;resize:vertical}
footer{margin-top:6rem;border-top:1px solid var(--line);padding:1.6rem 0 2.4rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;color:var(--muted);font:400 .85rem var(--m)}
footer button{all:unset;cursor:pointer;text-decoration:underline}
@media (max-width:50rem){.hero,.contact{grid-template-columns:1fr}.pillars,.tl{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.nav ul{display:none}.card-id{max-width:20rem}}
@media (prefers-reduced-motion:no-preference){h1{animation:in .8s ease-out both}@keyframes in{from{opacity:0;transform:translateY(16px)}}}
.nav ul a.act{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
h1{animation:none}
.w{display:inline-block;font-style:normal;opacity:0;animation:wd .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.1s + .2s)}
@keyframes wd{from{opacity:0;transform:translateY(.7em) rotate(4deg)}to{opacity:1;transform:none}}
.rv{opacity:0}
.rv.in{opacity:1;animation:up .9s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(32px)}}
.glow{position:fixed;left:0;top:0;width:30rem;height:30rem;margin:-15rem 0 0 -15rem;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 65%);pointer-events:none;z-index:-1;transform:translate(var(--x,60vw),var(--y,25vh));transition:transform .35s ease-out}
.bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:20}
.card-id{transition:transform .15s ease-out;will-change:transform}
.shot{position:relative;overflow:hidden;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.shot:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);animation:sh 4.5s ease-in-out 1.5s infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.status:before{animation:pl 2s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 .7rem transparent}}
.tags span{animation:dr 5s ease-in-out infinite;animation-delay:calc(var(--k,0)*-.8s);transition:border-color .2s,color .2s}
.tags span:hover{border-color:var(--accent);color:var(--accent)}
@keyframes dr{50%{transform:translateY(-6px)}}
.card,.proj{transition:transform .3s ease,border-color .3s ease}
.card:hover,.proj:hover{transform:translateY(-6px);border-color:var(--accent)}
.btn{transition:transform .2s ease,background .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:#070b14}
.tl{position:relative}
.tl:after{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--accent);transition:width 1.8s ease .3s}
.tl.in:after{width:100%}
.tl .now:before{animation:pl 2s ease-out infinite}
}
</head>
<body>
<div class="wrap">
<header class="nav"><a class="logo" href="#home">BO<i>/</i></a>
<ul><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#skills">Skills</a></li><li><a href="#projects">Projects</a></li><li><a href="#learning">Learning</a></li><li><a href="#contact">Contact</a></li></ul>
<a class="btn solid" href="#contact">Let’s connect</a></header>

<main id="home">
<div class="hero">
<div>
<p class="status">OPEN TO LEARNING, BUILDING, CONNECTING</p>
<h1>Web development <span>built step by step.</span></h1>
<p class="lead">I’m Being Orange, a self-taught web developer learning HTML, CSS, JavaScript and React by building real things in public. I’m looking for my first project, internship or junior role.</p>
<div class="row"><a class="btn solid" href="#projects">View my work</a><a class="btn" href="#about">About me</a><a class="btn" href="mailto:wczaraw@gmail.com">Email me</a></div>
</div>
<aside class="card-id" aria-label="Profile card"><div class="shot" aria-hidden="true">BO</div><p>BEING ORANGE / WEB DEVELOPER<br>Chattogram, Bangladesh</p></aside>
</div>
<div class="pillars"><div><b>Learner</b><span>Daily practice</span></div><div><b>Builder</b><span>Small real projects</span></div><div><b>Frontend</b><span>Clean, responsive UI</span></div><div><b>Open</b><span>Learning in public</span></div></div>

<section id="about">
<h2>Honest about <span>where I am.</span></h2>
<p class="sub">I don’t have a long client list yet. What I have is steady practice, projects I’m building right now, and a clear plan for the next six months.</p>
<div class="cards">
<div class="card"><h3>Learning in public</h3><p>I’ll link each project to its repository once it’s started, so you can see my progress as it happens.</p></div>
<div class="card"><h3>Professional profile</h3><p>The best way to reach me is email. GitHub and LinkedIn links will be added here as soon as they’re ready.</p></div>
<div class="card"><h3>How I work</h3><p>I start small, ship something that works, then improve it: accessible markup, responsive layouts, readable code.</p></div>
</div>
</section>

<section id="skills">
<h2>Skills <span>and what I’m learning.</span></h2>
<p class="sub">Solid ground first, then the next layer. Dashed tags are still in progress.</p>
<div class="tags"><span>HTML5</span><span>CSS3</span><span>Flexbox / Grid</span><span>JavaScript (ES6+)</span><span>Git &amp; GitHub</span><span>Responsive design</span><span class="l">React</span><span class="l">TypeScript</span><span class="l">Node.js</span><span class="l">REST APIs</span><span class="l">Tailwind CSS</span></div>
</section>

<section id="projects">
<h2>Projects <span>in progress, with receipts.</span></h2>
<p class="sub">Each card shows its real status, so you can see what’s being built and what’s coming next.</p>
<div class="scroller">
<article class="proj"><div class="pv"><span class="chip">IN PROGRESS</span><span>01</span></div><div class="pb"><h3>This portfolio</h3><p>The site you’re on, built from scratch in plain HTML, CSS and JavaScript. Next step: add real content and deploy.</p><small>HTML · CSS · JavaScript</small></div></article>
<article class="proj"><div class="pv"><span class="chip">IN PROGRESS</span><span>02</span></div><div class="pb"><h3>Task tracker</h3><p>A to-do app with filters and local saving, built to practice DOM events, state and accessible forms.</p><small>JavaScript · Local storage</small></div></article>
<article class="proj"><div class="pv"><span class="chip plan">PLANNED</span><span>03</span></div><div class="pb"><h3>Weather dashboard</h3><p>Fetch live data from a public weather API and show a clean forecast. Focus: async code and error handling.</p><small>React · REST API</small></div></article>
<article class="proj"><div class="pv"><span class="chip plan">PLANNED</span><span>04</span></div><div class="pb"><h3>Local business site</h3><p>A small, fast website for a shop or service near me, built to learn working with a real client’s needs.</p><small>Responsive design · SEO basics</small></div></article>
</div>
</section>

<section id="learning">
<h2>What I’m working <span>toward next.</span></h2>
<p class="sub">A simple roadmap I update as I go.</p>
<div class="tl">
<div class="now"><small>NOW</small><b>JavaScript fundamentals</b><p>DOM, events, fetch and async code.</p></div>
<div><small>NEXT</small><b>React</b><p>Components, hooks and state.</p></div>
<div><small>THEN</small><b>Backend basics</b><p>Node.js, Express and a database.</p></div>
<div><small>GOAL</small><b>First real project</b><p>Ship for a client or an internship.</p></div>
</div>
</section>

<section id="terminal">
<h2>Ask the <span>terminal.</span></h2>
<p class="sub">Try a command and see how it answers.</p>
<div class="term"><div class="bar">visitor@portfolio ~ </div><div id="out" aria-live="polite">Type “help” to see commands.</div>
<form id="tf"><span aria-hidden="true">$</span><input id="ti" aria-label="Terminal command" autocomplete="off" spellcheck="false"></form></div>
<div class="hints"><button type="button">help</button><button type="button">about</button><button type="button">skills</button><button type="button">status</button><button type="button">contact</button></div>
</section>

<section id="contact">
<h2>Let’s <span>connect.</span></h2>
<div class="contact">
<p class="sub">If you have a small project, an internship or advice for a beginner, I’d like to hear from you. This form opens an email draft.</p>
<form id="cf">
<label>NAME<input class="f" id="n" required></label>
<label>EMAIL<input class="f" id="e" type="email" required></label>
<label>MESSAGE<textarea id="m" required></textarea></label>
<button class="btn solid" type="submit">Open email draft</button>
</form>
</div>
</section>

<footer><span>© 2026 Being Orange. Built with HTML, CSS and JavaScript.</span><button id="theme" type="button">Switch theme</button></footer>
</main>
</div>
<script>
var A={help:"Commands: about, skills, status, contact, clear",
about:"Self-taught web developer in Chattogram, learning in public.",
skills:"Solid: HTML, CSS, JavaScript, Git. Learning: React, TypeScript, Node.js.",
status:"Open to internships, junior roles and small freelance projects.",
contact:"Email: wczaraw@gmail.com"};
var out=document.getElementById('out'),ti=document.getElementById('ti');
function run(c){c=c.trim().toLowerCase();if(!c)return;
if(c==='clear'){out.textContent='';return}
out.textContent+='\n$ '+c+'\n'+(A[c]||'Command not found: '+c+'. Type “help”.');out.scrollTop=out.scrollHeight}
document.getElementById('tf').addEventListener('submit',function(e){e.preventDefault();run(ti.value);ti.value=''});
document.querySelectorAll('.hints button').forEach(function(b){b.addEventListener('click',function(){run(b.textContent)})});
document.getElementById('cf').addEventListener('submit',function(e){e.preventDefault();
var n=document.getElementById('n').value,em=document.getElementById('e').value,m=document.getElementById('m').value;
location.href='mailto:wczaraw@gmail.com?subject='+encodeURIComponent('Portfolio message from '+n)+'&body='+encodeURIComponent(m+'\n\nReply to: '+em)});
document.getElementById('theme').addEventListener('click',function(){var r=document.documentElement,
d=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=d?'light':'dark'});
(function(){
var links=[].slice.call(document.querySelectorAll('.nav ul a'));
var ok=!matchMedia('(prefers-reduced-motion: reduce)').matches;
var bar=document.createElement('div');bar.className='bar';
function onS(){var h=document.documentElement.scrollHeight-innerHeight;bar.style.transform='scaleX('+(h>0?scrollY/h:0)+')';
var cur='#home';links.forEach(function(l){var s=document.querySelector(l.getAttribute('href'));if(s&&s.getBoundingClientRect().top<innerHeight*.4)cur=l.getAttribute('href')});
links.forEach(function(l){l.classList.toggle('act',l.getAttribute('href')===cur)})}
addEventListener('scroll',onS,{passive:true});onS();
if(!ok)return;
document.body.appendChild(bar);
var h1=document.querySelector('h1'),n=0;
(function sp(node){[].slice.call(node.childNodes).forEach(function(c){
if(c.nodeType===3){var f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(function(p){if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(' '))}else{var e=document.createElement('em');e.className='w';e.style.setProperty('--i',n++);e.textContent=p;f.appendChild(e)}});c.replaceWith(f)}
else if(c.nodeType===1)sp(c)})})(h1);
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('section h2,.sub,.card,.proj,.tl,.tags,.term,.hints,.pillars,#cf,.hero .lead,.hero .row,.status').forEach(function(el){
var i=[].indexOf.call(el.parentNode.children,el);el.style.setProperty('--d',Math.min(i,5)*.1+'s');el.classList.add('rv');io.observe(el)});
document.querySelectorAll('.tags span').forEach(function(s,i){s.style.setProperty('--k',i)});
var g=document.createElement('div');g.className='glow';document.body.appendChild(g);
addEventListener('mousemove',function(e){g.style.setProperty('--x',e.clientX+'px');g.style.setProperty('--y',e.clientY+'px')});
var c=document.querySelector('.card-id');
c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='perspective(800px) rotateY('+x*14+'deg) rotateX('+-y*14+'deg)'});
c.addEventListener('mouseleave',function(){c.style.transform=''});
var tio=new IntersectionObserver(function(es){if(es[0].isIntersecting){tio.disconnect();var t='help',i=0;(function k(){if(i<=t.length){ti.value=t.slice(0,i++);setTimeout(k,140)}else setTimeout(function(){run(t);ti.value=''},350)})()}},{threshold:.6});
tio.observe(document.querySelector('.term'));
})();
</script>
</body>
</html>
